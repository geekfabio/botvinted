# ───────────────────────────────────────────── 
# Scraping 
# ───────────────────────────────────────────── 
scraping: 
  delay_between_requests: 2       # segundos entre pedidos (não reduzir abaixo de 1) 
  max_pages_per_search: 1         # newest page is enough for periodic alerts
  results_per_page: 96 
  timeout_seconds: 30             # tempo máximo de espera por pedido
  reuse_saved_cookies: false      # false = pedir cookies frescos ao arrancar; evita loops 401/redirect
  country: "pt"                   # pt, es, fr, de, it, etc. 
  currency: "EUR" 
  retry_max_attempts: 3
  retry_backoff_seconds: 120
  retry_backoff_multiplier: 2
  retry_max_backoff_seconds: 900
  retry_after_max_seconds: 300
  retry_jitter_seconds: 10
  retry_status_codes: [403, 429, 500, 502, 503, 504]
  cookie_refresh_status_codes: [401]
 
# ───────────────────────────────────────────── 
# Base de dados 
# ───────────────────────────────────────────── 
database: 
  path: "data/seen_items.db"      # SQLite — guarda IDs já notificados 
 
# ───────────────────────────────────────────── 
# Logging 
# ───────────────────────────────────────────── 
logging: 
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR 
  file: "logs/bot.log" 
  max_size_mb: 10 
  backup_count: 3
