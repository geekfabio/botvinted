# ───────────────────────────────────────────── 
# Telegram 
# ───────────────────────────────────────────── 
telegram: 
  token: "${TELEGRAM_TOKEN}"       # lido do .env — não colocar aqui directamente 
  send_delay_seconds: 1.0
  send_max_retries: 3
  send_retry_backoff_seconds: 6
  send_timeout_seconds: 20
  verify_on_startup: true
  notify_on_startup: true
  destinations: 
    - chat_id: "7688548847"         # o teu chat pessoal 
      label: "Pessoal" 
    # - chat_id: "-987654321"      # (opcional) grupo 
    #   label: "Grupo Família" 
 
# ───────────────────────────────────────────── 
# Agendamento 
# ───────────────────────────────────────────── 
telegram_commands:
  enabled: true
  max_results: 5
  max_pages: 1
  state_path: "data/bot_state.json"

scheduler: 
  interval_minutes: 30             # intervalo entre verificações (mín. 10 recomendado) 
 
# ───────────────────────────────────────────── 
# Filtros globais (aplicados a todas as pesquisas) 
# ───────────────────────────────────────────── 
resale:
  enabled: true
  fixed_shipping_eur: 20
  eur_to_kz: 1300
  target_currency: "Kz"
  highlight_profit_min_kz: 50000
  profiles:
    iphone xr:
      sale_min_kz: 160000
      sale_max_kz: 180000
    iphone 11:
      sale_min_kz: 190000
      sale_max_kz: 200000
    iphone 13:
      sale_min_kz: 300000
      sale_max_kz: 340000
    iphone 12 pro max:
      sale_min_kz: 370000
      sale_max_kz: 420000
    iphone 17 pro max:
      sale_min_kz: 1000000
      sale_max_kz: 1400000
    iphone 15 pro max:
      sale_min_kz: 600000
      sale_max_kz: 420000    

global_filters: 
  require_seller_feedback: true
  max_item_age_days: 14
  require_item_age: true
  seller_min_stars: 3.1            # estritamente acima de 3 estrelas na escala de feedback 0–5
  seller_min_reviews: 1            # nº mínimo de avaliações do vendedor 
  exclude_keywords:                # ignora listagens com estas palavras no título 
    - "paypal" 
    - "para peças" 
    - "partido" 
 
# ───────────────────────────────────────────── 
# Pesquisas — adiciona quantas quiseres! 
# ───────────────────────────────────────────── 
detail_validation:
  enabled: true
  delay_between_detail_requests: 1
  max_items_per_search: 10

